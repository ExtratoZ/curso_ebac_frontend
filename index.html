<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="container">
            <img class="profile-avatar" src="" alt="." id="avatar">
            <h1 class="profile-name" id="user"></h1>
            <h2 class="profile-username" id="tag"></h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositories</h4>
                    <p id="repositories"></p>
                </li>
                <li class="numbers-item">
                    <h4>Follower</h4>
                    <p id="followers"></p>
                </li>
                <li class="numbers-item">
                    <h4>Following</h4>
                    <p id="following"></p>
                </li>
            </ul>
            <a href="#" class="profile-link" id="profile-link">See in Github</a>
        </div>
    </header>

    <script src="main.js"></script>
</body>
</html>
